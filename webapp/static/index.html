<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Напоминалкин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/styles.css?v=9" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div id="clockLine" class="clock">Загрузка…</div>
        <div id="tzLine" class="subclock"></div>
      </div>
      <button id="refreshBtn" class="icon-btn" title="Обновить">↻</button>
    </header>

    <main id="content" class="content"></main>

    <nav class="tabbar">
      <button class="tab" data-tab="users">
        <span class="tab-ico">👥</span><span>Люди</span>
      </button>
      <button class="tab" data-tab="notifications">
        <span class="tab-ico">🔔<i id="notifBadge" class="badge hidden">0</i></span><span>Уведомл.</span>
      </button>
      <button class="tab active" data-tab="reminders">
        <span class="tab-ico">📋</span><span>Напоминания</span>
      </button>
      <button class="tab" data-tab="settings">
        <span class="tab-ico">⚙️</span><span>Настройки</span>
      </button>
      <button class="tab" data-tab="info">
        <span class="tab-ico">ℹ️</span><span>Инфо</span>
      </button>
    </nav>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modalCard" class="modal-card"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/api.js?v=9"></script>
  <script src="/static/editor.js?v=9"></script>
  <script src="/static/app.js?v=9"></script>
</body>
</html>
